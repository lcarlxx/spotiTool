name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint and compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: python -m pip install --upgrade pip pyflakes
      - name: Byte compile
        run: python -m compileall -q spotifyProject bootstrap.py run.py run_cli.py tests
      - name: Pyflakes
        run: python -m pyflakes spotifyProject bootstrap.py run.py run_cli.py tests

  test:
    name: Tests (Windows, Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest

  build:
    name: PyInstaller build
    runs-on: windows-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Build executables
        run: python -m PyInstaller spotiTool.spec --noconfirm
      - name: Smoke test the CLI executable
        run: |
          .\dist\spotitool-cli.exe --version
          .\dist\spotitool-cli.exe --help
      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: spotitool-executables
          path: |
            dist/SpotiTool.exe
            dist/spotitool-cli.exe
          retention-days: 14
